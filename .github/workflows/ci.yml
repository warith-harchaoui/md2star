name: CI

on:
  push:
    branches: [main]
    tags: ['v*']
  pull_request:
    branches: [main]
  workflow_dispatch:

# A PR superseded by a newer commit cancels its old run so we don't
# queue dead work on the limited free-tier runners.
concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  # ──────────────────────────────────────────────────────────────────
  # Static lint via ruff — fast fail on style / unused-import /
  # common-bug-pattern regressions. Configuration in pyproject.toml.
  # ──────────────────────────────────────────────────────────────────
  lint:
    name: ruff
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
      - run: python -m pip install --upgrade ruff
      - run: ruff check md2star/ tests/

  # ──────────────────────────────────────────────────────────────────
  # Comment-density gate (house coding-standard rule 4). Fails when any
  # non-glue source file drops below the 15% floor. Pure stdlib, so no
  # install step is needed.
  # ──────────────────────────────────────────────────────────────────
  comment-density:
    name: comment-density
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: python scripts/audit_comments.py md2star

  # ──────────────────────────────────────────────────────────────────
  # Static shellcheck on the install / uninstall / test scripts.
  # Catches quoting bugs, unset variables, common shell-only issues.
  # ──────────────────────────────────────────────────────────────────
  shellcheck:
    name: shellcheck
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - run: sudo apt-get update && sudo apt-get install -y --no-install-recommends shellcheck
      - run: shellcheck scripts/install.sh scripts/uninstall.sh scripts/test.sh

  # ──────────────────────────────────────────────────────────────────
  # Unit tests across the supported Python interpreter range.
  # Ubuntu only — the Python pipeline has no OS-specific code; the
  # 3-OS integration matrix below covers platform regressions.
  # ──────────────────────────────────────────────────────────────────
  pytest:
    name: pytest / py${{ matrix.python-version }}
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.10", "3.11", "3.12", "3.13"]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
          cache: pip
      - name: Install pandoc (required by tests/test_lua_filter.py)
        run: sudo apt-get update && sudo apt-get install -y --no-install-recommends pandoc
      - name: Install md2star + dev deps
        run: |
          python -m pip install --upgrade pip
          python -m pip install -e ".[dev]"
      - run: python -m pytest tests/ -v

  # ──────────────────────────────────────────────────────────────────
  # CLI smoke — minimal sanity that the four console scripts plus
  # `md2star doctor` start cleanly. Catches packaging / entry-point
  # regressions before they reach end users.
  # ──────────────────────────────────────────────────────────────────
  cli-smoke:
    name: cli smoke
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
      - name: Install pandoc (so doctor reports a real version)
        run: sudo apt-get update && sudo apt-get install -y --no-install-recommends pandoc
      - name: Install md2star
        run: |
          python -m pip install --upgrade pip
          python -m pip install -e ".[dev]"
      - run: md2star --help
      - run: md2star --version
      - run: md2star doctor
      - name: md2star doctor --json (shape check)
        run: |
          md2star doctor --json > /tmp/doctor.json
          python -c "import json; j=json.load(open('/tmp/doctor.json')); assert 'features' in j and 'core_failing' in j, j; print('doctor JSON shape OK')"
      - run: md2docx --help
      - run: md2pptx --help
      - run: md2pdf --help

  # ──────────────────────────────────────────────────────────────────
  # Build the wheel + sdist via hatch. Catches packaging regressions
  # (force-include duplicates, missing data files, classifier typos)
  # and uploads the artifacts so releases can grab them from the
  # successful run instead of rebuilding locally.
  # ──────────────────────────────────────────────────────────────────
  build:
    name: build wheel + sdist
    runs-on: ubuntu-latest
    needs: [lint, pytest]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
      - run: python -m pip install --upgrade hatch twine
      - name: Build
        run: hatch build
      - name: twine check
        run: twine check dist/*
      - name: Confirm both artifacts produced
        run: |
          ls -la dist/
          test -f dist/md2star-*.whl
          test -f dist/md2star-*.tar.gz
      - name: Upload artifacts
        uses: actions/upload-artifact@v4
        with:
          name: md2star-dist
          path: dist/

  # ──────────────────────────────────────────────────────────────────
  # Wheel-install smoke — `pip install` the freshly-built wheel into
  # a clean venv and run the entry points. Catches packaging
  # regressions (typo'd [project.scripts], missing package-data,
  # bad classifier) that twine-check can't see because they only
  # surface on install. Runs after build via artifact download so
  # we test the EXACT bytes CI emitted, not a separate local build.
  # ──────────────────────────────────────────────────────────────────
  wheel-install-smoke:
    name: wheel install smoke
    runs-on: ubuntu-latest
    needs: build
    steps:
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Install pandoc (so `doctor` finds it)
        run: sudo apt-get update && sudo apt-get install -y --no-install-recommends pandoc
      - name: Download built wheel
        uses: actions/download-artifact@v4
        with:
          name: md2star-dist
          path: dist/
      - name: Install the wheel into a fresh venv
        run: |
          python -m venv /tmp/smoke-venv
          /tmp/smoke-venv/bin/pip install --upgrade pip
          /tmp/smoke-venv/bin/pip install dist/md2star-*.whl
      - name: Console scripts reachable
        run: |
          /tmp/smoke-venv/bin/md2star --version
          /tmp/smoke-venv/bin/md2star --help > /dev/null
          /tmp/smoke-venv/bin/md2docx --help > /dev/null
          /tmp/smoke-venv/bin/md2pptx --help > /dev/null
          /tmp/smoke-venv/bin/md2pdf --help > /dev/null
      - name: "`python -m md2star` works"
        run: /tmp/smoke-venv/bin/python -m md2star --version
      - name: doctor JSON is well-shaped
        run: |
          /tmp/smoke-venv/bin/md2star doctor --json > /tmp/doctor.json
          python -c "import json; j=json.load(open('/tmp/doctor.json')); assert 'features' in j and 'core_failing' in j"

  # ──────────────────────────────────────────────────────────────────
  # Coverage gate — runs pytest with pytest-cov, fails if coverage
  # drops below the threshold declared in pyproject.toml's
  # [tool.coverage.report] block. Catches the "we added a 200-line
  # module but no test for it" class of regression.
  # ──────────────────────────────────────────────────────────────────
  coverage:
    name: coverage
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
      - name: Install pandoc (required by tests/test_lua_filter.py)
        run: sudo apt-get update && sudo apt-get install -y --no-install-recommends pandoc
      - name: Install md2star + dev deps
        run: |
          python -m pip install --upgrade pip
          python -m pip install -e ".[dev]"
      - name: pytest with coverage
        run: python -m pytest tests/ --cov --cov-report=term-missing

  # ──────────────────────────────────────────────────────────────────
  # `pip-audit` — surface known CVEs in runtime + dev deps. Fails
  # the gate so we notice promptly when Pillow / langdetect ship a
  # security advisory. Pinning is permissive on purpose; this is
  # the safety net.
  # ──────────────────────────────────────────────────────────────────
  pip-audit:
    name: pip-audit
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
      - name: Install md2star + dev deps + pip-audit
        run: |
          python -m pip install --upgrade pip pip-audit
          python -m pip install -e ".[dev]"
      # `--skip-editable` excludes md2star itself (installed editable
      # above) from the audit — md2star is the package we're
      # shipping, not a dep to audit, and looking it up on PyPI
      # would fail on every untagged commit. We deliberately omit
      # `--strict` because it conflicts: with `--strict`, the
      # "distribution marked as editable" notice that `--skip-editable`
      # emits becomes a fatal error. The runtime + dev deps
      # (langdetect, Pillow, pytest, ruff, pypdf, pytest-cov) are
      # still audited normally; a real CVE in any of them surfaces
      # in the job output and bumps the exit code via pip-audit's
      # own non-strict behavior.
      - name: pip-audit
        run: pip-audit --skip-editable

  # ──────────────────────────────────────────────────────────────────
  # End-to-end conversion suite on the three target OSes. Installs
  # pandoc, runs `bash scripts/test.sh` (or a PowerShell equivalent
  # on Windows), greps the produced OOXML / PDF for expected content.
  # Catches platform-specific regressions in pandoc path resolution,
  # the Mermaid path, and the shell wrappers.
  # ──────────────────────────────────────────────────────────────────
  integration:
    name: integration / ${{ matrix.os }}
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-14, windows-latest]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip

      - name: Install pandoc (ubuntu)
        if: runner.os == 'Linux'
        run: sudo apt-get update && sudo apt-get install -y --no-install-recommends pandoc unzip
      - name: Install pandoc (macos)
        if: runner.os == 'macOS'
        run: brew install pandoc
      - name: Install pandoc (windows)
        if: runner.os == 'Windows'
        run: choco install -y pandoc

      - name: Install md2star (editable)
        run: |
          python -m pip install --upgrade pip
          python -m pip install -e ".[dev]"

      - name: Integration suite (bash, unix only)
        if: runner.os != 'Windows'
        run: bash scripts/test.sh

      - name: Integration suite (windows — drive the CLI directly)
        if: runner.os == 'Windows'
        shell: pwsh
        run: |
          md2docx assets/docx/basic.md
          if (-not (Test-Path assets/docx/basic.docx)) {
            Write-Error "basic.docx not produced"; exit 1
          }
          md2pptx assets/pptx/example.md
          if (-not (Test-Path assets/pptx/example.pptx)) {
            Write-Error "example.pptx not produced"; exit 1
          }

  # ──────────────────────────────────────────────────────────────────
  # PyPI publish on tag push (v*). Only fires when *all* of the
  # upstream gates pass. Reads the API token from the repository
  # `PYPI_API_TOKEN` secret; download the built artifacts from the
  # `build` job rather than rebuilding (keeps the published wheel
  # byte-identical to the one CI validated).
  # ──────────────────────────────────────────────────────────────────
  publish:
    name: publish to PyPI
    # Opt-in: a `v*` tag publishes to PyPI ONLY when the repository variable
    # `PUBLISH_TO_PYPI` is set to "true" (Settings → Secrets and variables →
    # Actions → Variables). This keeps tagging a release a safe, reversible act
    # by default — flip the variable when you intend to push to PyPI.
    if: startsWith(github.ref, 'refs/tags/v') && vars.PUBLISH_TO_PYPI == 'true'
    runs-on: ubuntu-latest
    needs: [lint, shellcheck, pytest, cli-smoke, build, integration]
    environment:
      name: pypi
      url: https://pypi.org/project/md2star/
    permissions:
      id-token: write       # for PyPI trusted publishing if configured later
    steps:
      - name: Download build artifacts
        uses: actions/download-artifact@v4
        with:
          name: md2star-dist
          path: dist/
      - name: Confirm artifacts present
        run: ls -la dist/
      - name: Publish to PyPI
        uses: pypa/gh-action-pypi-publish@release/v1
        with:
          password: ${{ secrets.PYPI_API_TOKEN }}
          skip-existing: true
