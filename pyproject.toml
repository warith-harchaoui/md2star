[build-system]
requires = ["hatchling>=1.21"]
build-backend = "hatchling.build"

[project]
name = "md2star"
# Version is single-sourced from md2star/__init__.py (__version__) via
# hatchling's version hook below — never hardcode it here. Bump the
# string in the package and the wheel metadata follows automatically.
dynamic = ["version"]
description = "Markdown → DOCX/PPTX/PDF bridge built on Pandoc, with curated styling, Mermaid rendering, and bibliography support."
readme = "README.md"
license = "BSD-3-Clause"
requires-python = ">=3.10"
authors = [{ name = "Warith Harchaoui" }]
keywords = ["markdown", "pandoc", "docx", "pptx", "office", "mermaid", "bibliography"]
classifiers = [
    "Development Status :: 4 - Beta",
    "Environment :: Console",
    "Intended Audience :: End Users/Desktop",
    "Intended Audience :: Science/Research",
    "License :: OSI Approved :: BSD License",
    "Operating System :: MacOS",
    "Operating System :: POSIX :: Linux",
    "Operating System :: Microsoft :: Windows",
    "Programming Language :: Python :: 3 :: Only",
    "Programming Language :: Python :: 3.10",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Programming Language :: Python :: 3.13",
    "Topic :: Text Processing :: Markup :: Markdown",
    "Topic :: Office/Business",
]
dependencies = [
    # click backs the `md2star-x` front-end (md2star/click_cli.py); a small,
    # ubiquitous CLI library kept in the core deps so that command is always
    # available alongside the argparse wrappers.
    "click>=8,<9",
    # os-helper is md2star's sibling in the same suite: it provides the hashing,
    # path/dir, temp-file, download, platform-detection, and named live-stream
    # logging primitives the package is built on. The 2.x line is the stable
    # AI Helpers foundation (hardened logging / file management / smart
    # downloads); md2star uses the alt-text hash helpers,
    # make_temporary_directory, temporary_filename(directory=), download_file
    # metadata, and the named-logger convenience functions (no stray root
    # basicConfig). Core dep. (Model-tag choice moved to best-engine-ai-helper
    # below, so os-helper's llm_model() is no longer used.)
    "os-helper>=2.0.0,<3",
    # best-engine-ai-helper is the suite's brief -> engine contract AND the LLM
    # transport. md2star commits `md2star/llm.brief.yaml`; on first use
    # `beh.ensure()` resolves it against this machine, writes the gitignored
    # `md2star/llm.engine.yaml`, and the opt-in AI passes (lint, alt-text,
    # diagram reconstruction) send every model call through
    # `best_engine_ai_helper.llm.chat`. Hard dependency — there is no urllib
    # fallback and no hard-coded model tag anywhere in the package. The transport
    # owns the daemon/serving lifecycle, so md2star no longer manages Ollama.
    "best-engine-ai-helper>=1.0.0,<2",
    "langdetect>=1.0.9,<2",
    # Pillow 12.x ships fixes for ~37 CVEs flagged on 11.3 by
    # pip-audit (PYSEC-2026-165, CVE-2026-25990, CVE-2026-40192,
    # CVE-2026-42309, CVE-2026-42310, ...). The upper bound is
    # permissive (`<14`) so pip can pick the latest compatible
    # release for the user's Python: 3.10 may land on the last
    # 12.x that still supports it, 3.11+ on the newest line.
    "Pillow>=10.0.0,<14",
]

[project.optional-dependencies]
# FastAPI HTTP surface (md2star.api). uvicorn serves it; python-multipart is
# required for the multipart /convert upload.
api = [
    "fastapi>=0.111,<1",
    "uvicorn>=0.30,<1",
    "python-multipart>=0.0.9",
]
# MCP surface (md2star.mcp) — fastapi-mcp wraps the FastAPI app, so it needs the
# api extra's runtime deps too.
mcp = [
    "fastapi-mcp>=0.3,<1",
    # Cap the MCP SDK below 2.0: fastapi-mcp 0.4.0 declares only `mcp>=1.12`
    # (no upper bound), but mcp 2.0.0 changed the low-level `Server.__init__`
    # signature and breaks fastapi-mcp at import (`Server.__init__() takes 2
    # positional arguments but 3 were given`). Pin to the 1.x line until
    # fastapi-mcp ships a 2.x-compatible release.
    "mcp>=1.12,<2",
    "fastapi>=0.111,<1",
    "uvicorn>=0.30,<1",
    "python-multipart>=0.0.9",
]
# Reverse conversion (DOCX/PPTX/PDF → Markdown) via Kreuzberg — the same engine
# the round-trip OCR test uses, now exposed as a runtime feature: the API's
# `POST /extract` and the full GUI's "Import" button both read a finished
# document back into Markdown. Heavy (Rust core + OCR), so it is opt-in and
# every surface degrades gracefully when it is absent:
#   pip install 'md2star[ocr]'
ocr = [
    "kreuzberg>=4,<5",
]
# The local GUI (`md2star gui`) ships bundled in this same wheel and needs no
# extra Python packages — its frontend (PDF.js, CodeMirror, Tailwind, fonts) is
# fully vendored and the server is pure stdlib. This extra exists so
# `pip install 'md2star[gui]'` is a valid, self-documenting command for GUI
# users, and reserves a home for any future GUI-only Python dependency. It
# resolves to the identical wheel as plain `md2star` — slimming the base install
# would need a separate distribution, which the project deliberately avoids.
gui = []
dev = [
    "pytest>=9.0.3,<10",
    "pytest-cov>=5.0,<7",   # coverage gate; see [tool.coverage.report] below
    "ruff>=0.6.0,<1",
    # pypdf 6.13+ ships fixes for CVE-2026-48735 / 49460 / 49461 /
    # 54530 / 54531 / GHSA-jm82-fx9c-mx94 flagged on the 5.x line.
    "pypdf>=6.13,<7",   # PDF-text extraction in integration tests
    # The api/mcp smoke tests skip cleanly without these, but CI installs them
    # so the FastAPI + MCP surfaces are actually exercised on every push.
    "fastapi>=0.111,<1",
    "uvicorn>=0.30,<1",
    "python-multipart>=0.0.9",
    "httpx>=0.27",
    "fastapi-mcp>=0.3,<1",
    # See the mcp extra above: cap the MCP SDK below the breaking 2.0.0.
    "mcp>=1.12,<2",
    # kreuzberg is the reverse reader for the OCR round-trip test
    # (tests/test_roundtrip_ocr.py): md → docx → pdf → text extraction.
    # It is a TEST-ONLY dependency — never imported by the md2star runtime —
    # and that test skips cleanly when kreuzberg (or LibreOffice) is absent.
    "kreuzberg>=4,<5",
]

[project.scripts]
md2star = "md2star.cli:main"
md2docx = "md2star.cli:md2docx_main"
md2pptx = "md2star.cli:md2pptx_main"
md2pdf  = "md2star.cli:md2pdf_main"
# Modern click front-end over the same conversion pipeline (md2star/click_cli.py).
md2star-x = "md2star.click_cli:main"
# HTTP + MCP servers (install with the [api] / [api,mcp] extras).
md2star-api = "md2star.api:main"
md2star-mcp = "md2star.mcp:main"

[project.urls]
Homepage = "https://github.com/warith-harchaoui/md2star"
Documentation = "https://github.com/warith-harchaoui/md2star#readme"
Issues = "https://github.com/warith-harchaoui/md2star/issues"
Source = "https://github.com/warith-harchaoui/md2star"
Changelog = "https://github.com/warith-harchaoui/md2star/blob/main/CHANGELOG.md"

[tool.hatch.version]
# Read __version__ from the package source — the single source of truth.
# Explicit pattern because the assignment carries a type annotation
# (``__version__: str = "..."``) which the default regex does not match.
path = "md2star/__init__.py"
pattern = '__version__:\s*str\s*=\s*"(?P<version>[^"]+)"'

[tool.hatch.build.targets.wheel]
# `packages = ["md2star"]` already picks up everything inside the
# md2star/ tree (Python sources + the data/ subtree with the bundled
# Lua filter, defaults YAMLs, templates, mermaid config).
#
# A previous `[tool.hatch.build.targets.wheel.force-include]` block
# re-added md2star/data on top — silently fine for editable installs,
# but the wheel build fails with "A second file is being added to the
# wheel archive at the same path". Removed.
packages = ["md2star"]

[tool.hatch.build.targets.sdist]
include = [
    "/md2star",
    "/tests",
    "/docs",
    "/assets",
    "/scripts",
    "/skills",
    "/minimal-gui",
    "/Makefile",
    "/README.md",
    "/LISEZMOI.md",
    "/EXAMPLES.md",
    "/CHANGELOG.md",
    "/CONTRIBUTING.md",
    "/SECURITY.md",
    "/ROADMAP.md",
    "/LANDSCAPE.md",
    "/LICENSE",
]
# Rendered fixtures regenerable from their .md sources via
# `bash scripts/test.sh` and `tests/examples/run.sh`. Excluding
# them from the sdist drops it from ~25 MB to ~1 MB without
# losing any test capability — the integration runners (and the
# README "examples gallery") rebuild them on first run.
exclude = [
    "assets/docx/*.docx",
    "assets/pptx/*.pptx",
    "tests/examples/*.docx",
    "tests/examples/*.pptx",
    "tests/examples/*.pdf",
]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-ra"
# Registered markers keep `--strict`-style runs warning-free and document the
# opt-out. `slow` tags tests that shell out to LibreOffice / kreuzberg (the OCR
# round-trip); skip them with `pytest -m "not slow"` for a millisecond suite.
markers = [
    "slow: end-to-end test that renders via LibreOffice and/or runs kreuzberg OCR",
    "ai_eval: quality eval of the opt-in Ollama passes; needs a local daemon, skips in CI",
]

# Coverage configuration — wired into the CI's `coverage` job (see
# .github/workflows/ci.yml). The threshold is intentionally moderate;
# the goal is to catch regressions where a big chunk of code goes
# untested, NOT to force test-every-branch maximalism.
[tool.coverage.run]
source = ["md2star"]
branch = true
omit = [
    # __main__.py is a one-line forward to cli.main; covering it would
    # need a subprocess, which we already test via the cli-smoke job.
    "md2star/__main__.py",
    # The api / mcp surfaces are optional extras: their happy path needs a
    # running ASGI server + Pandoc, so they are smoke-tested for import and
    # error handling but kept out of the coverage gate (same rationale as
    # __main__.py). The ImportError guards carry `pragma: no cover`.
    "md2star/api.py",
    "md2star/mcp.py",
    # The GUI server is the same shape: its happy path needs a live
    # http.server + a browser + Pandoc, exercised by the /render smoke
    # tests rather than line-coverage. Its security-critical path
    # confinement (_safe_within_root) IS unit-tested — see
    # tests/test_gui_security.py — but the HTTP handlers are kept out of
    # the coverage gate, consistent with api.py / mcp.py.
    "md2star/gui_server.py",
]

[tool.coverage.report]
fail_under = 70
show_missing = true
skip_covered = false
exclude_lines = [
    "pragma: no cover",
    "raise NotImplementedError",
    "if __name__ == .__main__.:",
]

[tool.ruff]
target-version = "py310"
line-length = 100
exclude = [
    ".venv",
    "build",
    "dist",
]

[tool.ruff.lint]
# Lean baseline — pyflakes (F) catches real bugs, pycodestyle errors
# (E) catches whitespace/indent issues, isort (I) keeps imports tidy,
# bugbear (B) flags common pitfalls. We deliberately do NOT enable
# the "noisy" rules (ANN type-annotation, D docstrings, PT pytest
# style) so the gate stays useful rather than aspirational.
select = ["E", "F", "I", "B", "UP"]
ignore = [
    "E501",    # line length — handled by --line-length above; many comments exceed
    "B008",    # function calls in argument defaults — fine for our argparse helpers
    "B023",    # loop-variable late binding — we have one intentional usage in
               # md2star/preprocessing/tables.py where the closure is invoked
               # in the same iteration; the rule is too noisy for the benefit.
]

[tool.ruff.lint.per-file-ignores]
"tests/*" = ["B", "UP"]   # tests have idioms (mocks, fixtures) that bugbear over-flags
